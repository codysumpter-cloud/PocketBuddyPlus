<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buddy Home</title>
<!--
  Template for the shipped home.html. The style and script are substituted in
  by scripts/build-plugins.mjs - the panel sandbox has no script asset kind, so
  everything the page needs has to end up inline in this one file.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
<style>
#home-root {
  position: relative;
  margin: 0;
  width: 100vw;
  height: 100vh;
  display: grid;
  grid-template-rows: auto auto minmax(280px, 1fr) auto;
  overflow: hidden;
  background: #121827;
  color: #f7f8ff;
}

.pb-home-header,
.pb-home-toolbar,
.pb-home-footer {
  position: relative;
  z-index: 2;
}

.pb-home-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 12px 16px 10px;
  background: linear-gradient(180deg, #222c45, #182033);
}

.pb-home-header h2 {
  margin: 1px 0 3px;
  font-size: clamp(1.35rem, 2.5vw, 1.8rem);
}

.pb-home-header p {
  margin: 0;
  color: #b9c2d9;
  font-size: 0.86rem;
}

.pb-home-eyebrow {
  color: #efb84a !important;
  font-size: 0.68rem !important;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.pb-home-close {
  width: 36px;
  height: 36px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.08);
  color: inherit;
  font-size: 1.4rem;
  cursor: pointer;
}

.pb-home-toolbar {
  display: grid;
  grid-template-columns: max-content max-content minmax(320px, 1fr);
  grid-template-rows: auto auto;
  align-items: end;
  gap: 7px 12px;
  padding: 7px 12px 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  background: #192238;
}

.pb-home-tool-section {
  display: grid;
  gap: 3px;
  min-width: max-content;
}

.pb-home-furniture-section {
  min-width: 320px;
  overflow: hidden;
}

.pb-home-tool-label {
  color: #95a2bf;
  font-size: 0.61rem;
  font-weight: 850;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.pb-home-mode-buttons,
.pb-home-brushes,
.pb-home-items,
.pb-home-actions,
.pb-home-movement {
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
}

.pb-home-items,
.pb-home-actions {
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
}

.pb-home-toolbar button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 31px;
  flex: 0 0 auto;
  padding: 5px 8px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.06);
  color: #edf1ff;
  font: inherit;
  font-size: 0.72rem;
  font-weight: 750;
  cursor: pointer;
}

.pb-home-toolbar button:hover,
.pb-home-toolbar button:focus-visible {
  border-color: rgba(255, 216, 77, 0.7);
  background: rgba(255, 216, 77, 0.11);
}

.pb-home-toolbar button.active {
  border-color: #ffd84d;
  background: rgba(255, 216, 77, 0.17);
  box-shadow: 0 0 0 2px rgba(255, 216, 77, 0.15);
}

.pb-home-swatch,
.pb-home-item-dot {
  width: 13px;
  height: 13px;
  flex: 0 0 13px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 4px;
  background: #c99968;
}

.pb-home-swatch.stone { background: #8b94a5; }

.pb-home-swatch.grass { background: #77ad68; }

.pb-home-swatch.water { background: #55a9d8; }

.pb-home-swatch.erase {
  background: repeating-linear-gradient(45deg, #5a6377 0 3px, #252d41 3px 6px);
}

[data-home-item-asset="home.bed.basic"] .pb-home-item-dot { background: #8c6fb2; }

[data-home-item-asset="home.food-bowl.basic"] .pb-home-item-dot { background: #d9824b; }

[data-home-item-asset="home.toy.ball"] .pb-home-item-dot { background: #4f9ce8; border-radius: 50%; }

[data-home-item-asset="home.tv.basic"] .pb-home-item-dot { background: #29334a; box-shadow: inset 0 0 0 3px #70e1c8; }

[data-home-item-asset="home.chair.basic"] .pb-home-item-dot { background: #9f704d; }

[data-home-item-asset="home.table.basic"] .pb-home-item-dot { background: #7f573b; }

[data-home-item-asset="home.plant.basic"] .pb-home-item-dot { background: #4b8f55; border-radius: 50% 50% 45% 45%; }

.pb-home-actions {
  grid-column: 1 / -1;
  grid-row: 2;
  padding-top: 6px;
  padding-right: 156px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.pb-home-movement {
  position: absolute;
  right: 12px;
  bottom: 8px;
}

.pb-home-movement button {
  width: 31px;
  padding: 0;
}

.pb-home-stage {
  position: relative;
  min-height: 280px;
  outline: none;
  background:
    radial-gradient(circle at 50% 15%, rgba(89, 112, 167, 0.22), transparent 42%),
    #182033;
}

.pb-home-stage:focus-visible {
  box-shadow: inset 0 0 0 2px rgba(255, 216, 77, 0.65);
}

.pb-home-stage canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
  image-rendering: pixelated;
}

.pb-home-footer {
  display: grid;
  grid-template-columns: minmax(300px, 1.25fr) minmax(220px, 1fr);
  align-items: center;
  gap: 14px;
  min-height: 42px;
  padding: 7px 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.09);
  background: #101625;
  color: #aeb8d0;
  font-size: 0.72rem;
}

.pb-home-footer [data-home-status] {
  color: #ffd84d;
  font-weight: 800;
}

.pb-home-footer [data-home-thought] {
  color: #e8ecfa;
  font-style: italic;
}

.pb-home-help {
  display: none;
}

@media (max-height: 760px) {
  .pb-home-modal { padding: 0; }
  .pb-home-panel {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }
  .pb-home-header { padding: 8px 12px 7px; }
  .pb-home-header p { display: none; }
  .pb-home-header h2 { font-size: 1.35rem; }
  .pb-home-toolbar { padding: 5px 10px 6px; }
  .pb-home-footer { min-height: 38px; padding: 5px 10px; }
}

@media (max-width: 900px) {
  .pb-home-modal { padding: 0; }
  .pb-home-panel {
    width: 100vw;
    height: 100vh;
    border: 0;
    border-radius: 0;
  }
  .pb-home-toolbar {
    grid-template-columns: max-content max-content minmax(280px, 1fr);
    overflow-x: auto;
  }
  .pb-home-footer {
    grid-template-columns: 1fr;
    gap: 3px;
  }
}


/* Presence runtime ------------------------------------------------------- */
.pb-home-presence-bar {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 2px solid #29334a;
  background: rgba(11, 16, 32, .94);
}
.pb-home-segment { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid #3d4965; border-radius: 8px; background: #151d31; }
.pb-home-segment button { min-width: 58px; }
.pb-home-segment button.active { background: #ffd84d; color: #241d12; border-color: #fff1a8; }
.pb-home-presence-name { margin-left: auto; font-weight: 800; color: #ffd84d; }
#home-root[data-presentation="home"] .pb-home-header,
#home-root[data-presentation="home"] .pb-home-toolbar,
#home-root[data-presentation="home"] .pb-home-footer { display: none; }
#home-root[data-presentation="home"] .pb-home-shell { height: 100vh; grid-template-rows: auto minmax(0, 1fr); }
#home-root[data-presentation="home"] .pb-home-stage { min-height: 0; height: 100%; }
#home-root[data-presentation="home"] .pb-home-presence-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); border: 1px solid #3d4965; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
#home-root[data-simulation="idle"] .pb-home-movement { opacity: .35; pointer-events: none; }
</style>

	selectedMode = snapshot.mode;
	selectedAssetId = snapshot.selectedAssetId;
	const status = root.querySelector("[data-home-status]");
	const thought = root.querySelector("[data-home-thought]");
	if (status) status.textContent = `${snapshot.buddyName} · ${snapshot.buddyMood} · ${simulation === "idle" ? "Idle household" : "Player control"} · ${snapshot.itemCount} items`;
	if (thought) thought.textContent = `“${snapshot.thought}”`;
	syncControls();
}
function handleClick(event) {
	const target = event.target;
	const presentationButton = target.closest("[data-home-presentation]");
	if (presentationButton) {
		const mode = presentationButton.dataset.homePresentation;
		if (mode === "panel" || mode === "home" || mode === "buddy") panel.postMessage({
			type: "home-presentation",
			mode
		});
		return;
	}
	const simulationButton = target.closest("[data-home-simulation]");
	if (simulationButton) {
		const mode = simulationButton.dataset.homeSimulation;
		if (HOME_SIMULATION_MODES.includes(mode)) {
			simulation = mode;
			controller?.setSimulationMode(mode);
			applyPresentation();
		}
		return;
	}
	if (target.closest("[data-home-close]")) {
		panel.postMessage({ type: "home-panel-closing" });
		panel.close();
		return;
	}
	const modeButton = target.closest("[data-home-mode]");
	if (modeButton) {
		const mode = modeButton.dataset.homeMode;
		if (HOME_MODES.includes(mode)) {
			selectedMode = mode;
			controller?.setMode(mode);
			syncControls();
		}
		return;
	}
	const brushButton = target.closest("[data-home-brush]");
	if (brushButton) {
		const brush = brushButton.dataset.homeBrush;
		if (HOME_BRUSHES.includes(brush)) {
			selectedBrush = brush;
			selectedMode = "paint";
			controller?.setBrush(brush);
			controller?.setMode("paint");
			syncControls();
		}
		return;
	}
	const itemButton = target.closest("[data-home-item-asset]");
	if (itemButton) {
		const assetId = itemButton.dataset.homeItemAsset ?? "";
		if (HOME_ITEM_ASSETS.includes(assetId)) {
			selectedAssetId = assetId;
			selectedMode = "place";
			controller?.setItemAsset(assetId);
			controller?.setMode("place");
			syncControls();
		}
		return;
	}
	const moveButton = target.closest("[data-home-move]");
	if (moveButton) {
		controller?.movePlayer(moveButton.dataset.homeMove);
		return;
	}
	const rotate = target.closest("[data-home-rotate]");
	if (rotate) {
		controller?.rotate(Number(rotate.dataset.homeRotate));
		return;
	}
	if (target.closest("[data-home-load-pack]")) {
		panel.postMessage({ type: "home-pack-pick" });
		return;
	}
	if (target.closest("[data-home-pet]")) controller?.petBuddy();
	else if (target.closest("[data-home-use]")) controller?.interactSelected();
	else if (target.closest("[data-home-channel]")) controller?.interactSelected("next-channel");
	else if (target.closest("[data-home-clear-floor]")) controller?.clearFloor();
	else if (target.closest("[data-home-reset-room]")) controller?.resetRoom();
}
function syncControls() {
	root.querySelectorAll("[data-home-mode]").forEach((node) => node.classList.toggle("active", node.dataset.homeMode === selectedMode));
	root.querySelectorAll("[data-home-brush]").forEach((node) => node.classList.toggle("active", node.dataset.homeBrush === selectedBrush));
	root.querySelectorAll("[data-home-item-asset]").forEach((node) => node.classList.toggle("active", node.dataset.homeItemAsset === selectedAssetId));
}
function applyPresentation() {
	root.dataset.presentation = presentation;
	root.dataset.simulation = simulation;
	root.querySelectorAll("[data-home-presentation]").forEach((node) => node.classList.toggle("active", node.dataset.homePresentation === presentation));
	root.querySelectorAll("[data-home-simulation]").forEach((node) => node.classList.toggle("active", node.dataset.homeSimulation === simulation));
	const name = root.querySelector("[data-home-presence-name]");
	if (name) name.textContent = buddyPresence?.displayName ?? "Buddy";
}
async function decodeImage(dataUrl) {
	return await new Promise((resolve, reject) => {
		const image = new Image();
		image.onload = () => resolve(image);
		image.onerror = reject;
		image.src = dataUrl;
	});
}
async function handlePanelMessage(message) {
	if (message.type === "home-state" && message.values && typeof message.values === "object") {
		savedValues = { ...message.values };
		if (!controller) renderShell();
		return;
	}
	if (message.type === "home-presentation" && (message.mode === "panel" || message.mode === "home")) {
		presentation = message.mode;
		applyPresentation();
		return;
	}
	if (message.type === "home-buddy-presence" && message.buddy && typeof message.buddy === "object") {
		const buddy = message.buddy;
		const profile = buddy.profile && typeof buddy.profile === "object" ? buddy.profile : {};
		buddyPresence = {
			displayName: typeof profile.displayName === "string" ? profile.displayName : typeof buddy.name === "string" ? buddy.name : "Buddy",
			mood: typeof profile.mood === "string" ? profile.mood : "content",
			activity: typeof profile.activity === "string" ? profile.activity : "idle",
			dominantNeed: typeof profile.dominantNeed === "string" ? profile.dominantNeed : "social",
			affection: typeof profile.affection === "number" ? profile.affection : void 0,
			needs: profile.needs && typeof profile.needs === "object" ? profile.needs : void 0
		};
		controller?.setBuddyPresence(buddyPresence);
		applyPresentation();
		return;
	}
	if (message.type === "home-buddy-frame-begin") {
		buddyFrameChunks = Array(Math.max(0, Number(message.count) || 0)).fill("");
		return;
	}
	if (message.type === "home-buddy-frame-chunk" && typeof message.data === "string") {
		buddyFrameChunks[Number(message.index) || 0] = message.data;
		return;
	}
	if (message.type === "home-buddy-frame-end") {
		try {
			buddyImage = await decodeImage(buddyFrameChunks.join(""));
			controller?.setBuddyAppearance(buddyImage);
		} catch {
			buddyImage = null;
			controller?.setBuddyAppearance(null);
		}
		buddyFrameChunks = [];
		return;
	}
	if (message.type === "home-pack-begin") {
		spriteChunks = new Map((Array.isArray(message.keys) ? message.keys : []).map((key) => [String(key), []]));
		return;
	}
	if (message.type === "home-pack-chunk" && typeof message.key === "string" && typeof message.data === "string") {
		const list = spriteChunks.get(message.key) ?? [];
		list[Number(message.index) || 0] = message.data;
		spriteChunks.set(message.key, list);
		return;
	}
	if (message.type === "home-pack-end") {
		const next = {};
		await Promise.all([...spriteChunks.entries()].map(async ([key, chunks]) => {
			try {
				next[key] = await decodeImage(chunks.join(""));
			} catch {}
		}));
		spriteImages = next;
		setHomeSprites(next);
		return;
	}
	if (message.type === "home-pack-error" && typeof message.error === "string") {
		const thought = root.querySelector("[data-home-thought]");
		if (thought) thought.textContent = message.error;
	}
}
panel.onMessage((message) => {
	if (message && typeof message === "object") handlePanelMessage(message);
});
window.addEventListener("pagehide", () => {
	panel.postMessage({ type: "home-panel-closing" });
	controller?.destroy();
	controller = null;
}, { once: true });
panel.postMessage({ type: "home-state-request" });
//#endregion

</script>
</body>
</html>
