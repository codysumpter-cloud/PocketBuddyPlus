appId: dev.prismtek.pocketbuddyplus
productName: Pocket Buddy Plus
executableName: pocket-buddy-plus
copyright: Copyright © 2026 Prismtek; OpenPets contributors

directories:
  output: dist-electron-plus

artifactName: Pocket-Buddy-Plus-${version}-${os}-${arch}.${ext}

# Electron derives app.getName() -- and therefore the userData directory -- from
# the packaged package.json "name". Without this override the Plus build inherits
# "@open-pets/desktop" and shares its entire user-data directory with the
# inherited OpenPets build. The inherited target deliberately has no equivalent
# override so existing OpenPets installs keep their current userData path.
extraMetadata:
  name: Pocket Buddy Plus

files:
  - dist/**
  - control-center-preload.cjs
  - pet-preload.cjs
  - plugin-sdk-preload.cjs
  - plugin-command-form-preload.cjs
  - panel-preload.cjs
  - assets/**
  - package.json

extraResources:
  - from: ../../plugins/official
    to: plugins/official

asar: true
asarUnpack:
  - node_modules/**
npmRebuild: false
publish: null

toolsets:
  appimage: 1.0.3

mac:
  icon: assets/app-icon.icns
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: assets/app-icon.ico
  target:
    - nsis
  verifyUpdateCodeSignature: false

nsis:
  artifactName: Pocket-Buddy-Plus-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: assets/app-icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  category: Utility
  maintainer: Prismtek
