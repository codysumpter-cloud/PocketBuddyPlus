appId: dev.prismtek.pocketbuddyplus
productName: Pocket Buddy Plus
executableName: pocket-buddy-plus
copyright: Copyright © 2026 Prismtek; OpenPets contributors

directories:
  output: dist-electron-plus

artifactName: Pocket-Buddy-Plus-${version}-${os}-${arch}.${ext}

# NOTE: do not add `extraMetadata` here. In this pnpm workspace electron-builder
# resolves the "project" to the workspace root and rewrites the root package.json
# in place, clobbering the workspace manifest. The Plus build is instead
# identified at runtime from `executableName` below (see src/product.ts).

files:
  - dist/**
  - control-center-preload.cjs
  - pet-preload.cjs
  - plugin-sdk-preload.cjs
  - plugin-command-form-preload.cjs
  - panel-preload.cjs
  - buddy-surface-preload.cjs
  - assets/**
  - package.json

extraResources:
  - from: ../../plugins/official
    to: plugins/official

asar: true
asarUnpack:
  - node_modules/**
npmRebuild: false
publish: null

toolsets:
  appimage: 1.0.3

mac:
  icon: assets/app-icon.icns
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: assets/app-icon.ico
  target:
    - nsis
  verifyUpdateCodeSignature: false

nsis:
  artifactName: Pocket-Buddy-Plus-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: assets/app-icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  category: Utility
  maintainer: Prismtek
