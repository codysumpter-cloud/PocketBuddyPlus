name: Apply TinyHouse UI behavior

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/tinyhouse-ui-overhaul

      - name: Patch UI behavior and run contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("games/tinyhouse-local/app.js")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one app.js replacement target, found {count}: {old[:90]!r}")
              text = text.replace(old, new, 1)

          replace_once("  const PAGE_SIZE = 18;", "  const PAGE_SIZE = 12;")

          replace_once(
              '  const tools = $("#selection-tools");\n  const toast = $("#toast");',
              '  const tools = $("#selection-tools");\n  const toast = $("#toast");\n  const catalogCount = $("#catalog-count");\n  const selectionName = $("#selection-name");\n  const selectionMeta = $("#selection-meta");\n  const assetPackSummary = $("#asset-pack-summary");',
          )

          replace_once(
              "      button.append(image);\n      if (asset.animated) {",
              "      button.append(image);\n      const label = document.createElement(\"span\");\n      label.className = \"asset-name\";\n      label.textContent = asset.name;\n      button.append(label);\n      if (asset.animated) {",
          )

          replace_once(
              '    $("#next-page").disabled = state.page >= pageCount - 1;\n  }',
              '    $("#next-page").disabled = state.page >= pageCount - 1;\n    if (catalogCount) catalogCount.textContent = `${assets.length.toLocaleString()} ITEMS`;\n  }',
          )

          replace_once(
              '      activate.title = asset?.animated ? `${animationBadge(asset)}: ${asset.name}` : "This item has no animation";\n    }\n  }\n\n  function screenToWorld',
              '      activate.title = asset?.animated ? `${animationBadge(asset)}: ${asset.name}` : "This item has no animation";\n    }\n    if (selectionName) selectionName.textContent = asset?.name || "Nothing selected";\n    if (selectionMeta) {\n      if (!placement || !asset) {\n        selectionMeta.textContent = "Choose an object in the room.";\n      } else {\n        const support = placement.supportId ? findPlacement(placement.supportId) : null;\n        const supportAsset = support && findAsset(support.assetId);\n        const location = placement.supportId\n          ? `On ${supportAsset?.name || "tabletop"}`\n          : `Grid ${placement.column.toFixed(1)}, ${placement.row.toFixed(1)}`;\n        const behavior = asset.animated ? ` · ${animationBadge(asset)}` : "";\n        selectionMeta.textContent = `${asset.category} · ${location}${behavior}`;\n      }\n    }\n  }\n\n  function screenToWorld',
          )

          replace_once(
              '    state.manifest = data.assets;\n    chooseDefaults();',
              '    state.manifest = data.assets;\n    if (assetPackSummary) assetPackSummary.textContent = `${data.count.toLocaleString()} objects · ${data.animationGroups} animations · local licensed art`;\n    chooseDefaults();',
          )

          path.write_text(text, encoding="utf-8")
          PY

          node --check games/tinyhouse-local/app.js
          node games/tinyhouse-local/test-contract.mjs
          git diff --check

          rm .github/workflows/apply-tinyhouse-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(game): finish TinyHouse UI overhaul"
          git push origin HEAD:agent/tinyhouse-ui-overhaul
