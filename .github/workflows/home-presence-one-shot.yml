name: Home presence one-shot

on:
  push:
    branches:
      - feat/home-presence-runtime
    paths:
      - .github/workflows/home-presence-one-shot.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-presence-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Apply source patch
        run: python .github/scripts/home_presence_patch.py

      - name: Build generated plugin artifacts
        run: pnpm plugins:build

      - name: Verify generated plugin artifacts
        run: pnpm plugins:build:check

      - name: Typecheck Home plugin
        run: pnpm plugins:typecheck

      - name: Test Home plugin runtime
        run: node plugins/official/openpets.home-builder/test.js

      - name: Check plugin SDK
        run: pnpm --filter @open-pets/plugin-sdk check

      - name: Run desktop tests
        run: pnpm --filter @open-pets/desktop test

      - name: Check plugin locales
        run: pnpm plugins:locales

      - name: Remove one-shot scaffolding
        run: rm -f .github/scripts/home_presence_patch.py .github/workflows/home-presence-one-shot.yml

      - name: Commit verified branch output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "feat(home): add canonical Buddy presence runtime"
            git push origin HEAD:feat/home-presence-runtime
          fi

