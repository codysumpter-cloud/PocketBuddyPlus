name: Buddy Brain Lockfile Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.head_ref == 'agent/buddy-brain-visual-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate exact pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: buddy-brain-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
