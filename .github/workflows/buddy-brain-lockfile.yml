name: Buddy Brain Lockfile Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.head_ref == 'agent/buddy-brain-visual-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate exact pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(buddy-brain): update pnpm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: buddy-brain-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
