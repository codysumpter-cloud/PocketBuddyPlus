name: Resolve PR 12 conflicts

on:
  push:
    branches:
      - automation/resolve-pr12-conflicts

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out resolution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/resolve-pr12-conflicts

      - name: Apply three-way conflict resolution
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8-sig")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one replacement target in {path}, found {text.count(old)}")
              write(path, text.replace(old, new, 1))

          replace_once(
              "README.md",
              """- [`docs/plugins.md`](docs/plugins.md) - Plugin platform SDK v3 manifest, permissions, and testing kit.\n- [`docs/claude-integration.md`](docs/claude-integration.md) - Integrating with Claude Code (memory, hooks, MCP).\n- [`docs/opencode.md`](docs/opencode.md) - Integrating with OpenCode workspaces.\n- [`docs/wsl-ipc.md`](docs/wsl-ipc.md) - Setting up the WSL-to-Windows TCP bridge.\n- [`docs/testing.md`](docs/testing.md) - Workspace test and conformance strategy.\n- [`docs/release.md`](docs/release.md) - Application packaging and release processes.\n- [`docs/workflow.md`](docs/workflow.md) - Core development and contributions workflow.\n""",
              """- [`docs/architecture.md`](docs/architecture.md) - The one-page mental model: runtime topology, package spine, end-to-end flows.\n- [`docs/desktop.md`](docs/desktop.md) - The Electron app: process model, tray-first UX, Control Center, security model.\n- [`docs/agent-integrations.md`](docs/agent-integrations.md) - How Claude Code, MCP, OpenCode, Cursor, and Pi are configured.\n- [`docs/plugins.md`](docs/plugins.md) - Plugin platform SDK v3 manifest, permissions, and sandboxed runtime.\n- [`docs/sdk.md`](docs/sdk.md) - Public SDK v3 contract for plugin authors: capability namespaces, permission surface, test harness.\n- [`docs/catalog.md`](docs/catalog.md) - Pet and plugin catalog contracts: v3/v2, pagination, install artifacts.\n- [`docs/development.md`](docs/development.md) - Developer experience: monorepo layout, command surface, dev modes.\n- [`docs/testing-and-validation.md`](docs/testing-and-validation.md) - Quality gates: behavior tests, runtime checks, release validators.\n- [`docs/release.md`](docs/release.md) - Application packaging and release processes.\n""",
          )

          replace_once(
              "apps/desktop/scripts/run-tests.mjs",
              '  ".test-dist/tests/lan-state.test.js",\n',
              '  ".test-dist/tests/lan-state.test.js",\n  ".test-dist/tests/lan-pet-presence.test.js",\n  ".test-dist/tests/lan-pet-activity.test.js",\n',
          )
          replace_once(
              "apps/desktop/scripts/run-tests.mjs",
              '  ".test-dist/tests/onboarding-state.test.js",\n',
              '  ".test-dist/tests/onboarding-state.test.js",\n  ".test-dist/tests/opencode-command.test.js",\n',
          )

          packaging_anchor = 'assert.match(mainSource, /isLinux && !allowWayland[\\s\\S]*?appendSwitch\\("ozone-platform", "x11"\\)/, "Linux desktop pets must force X11/Xwayland because native Wayland blocks always-on-top and programmatic window positioning.");\n'
          packaging_insert = packaging_anchor + '''assert.match(mainSource, /if \\(process\\.platform === "linux"\\) \\{\\n\\s*app\\.commandLine\\.appendSwitch\\("password-store", "gnome-libsecret"\\);\\n\\s*\\} else \\{\\n\\s*app\\.commandLine\\.appendSwitch\\("password-store", "basic"\\);\\n\\s*\\}/, "Linux desktop must gate password-store as gnome-libsecret on Linux with basic only in the non-Linux else branch; an unconditional switch would disable Electron safeStorage and break plugin secret saves with 'Secret storage encryption is unavailable on this system'.");\nconst passwordStoreValues = [...mainSource.matchAll(/appendSwitch\\("password-store",\\s*"([^\"]+)"\\)/g)].map((match) => match[1]);\nassert.deepStrictEqual(passwordStoreValues, ["gnome-libsecret", "basic"], "desktop must set password-store exactly twice (gnome-libsecret on Linux, basic otherwise); any extra or unconditional switch would override the backend and re-break plugin secret saves.");\n'''
          replace_once(
              "apps/desktop/src/check-packaging-contract.ts",
              packaging_anchor,
              packaging_insert,
          )

          replace_once(
              "apps/desktop/src/main.ts",
              """// Pocket Buddy Plus does not store browser passwords, cookies, or encrypted app secrets.\n// Keep Chromium/Electron from prompting for macOS Keychain or Linux keyring access\n// during startup/profile initialization.\napp.commandLine.appendSwitch("use-mock-keychain");\napp.commandLine.appendSwitch("password-store", "basic");\n""",
              """// Pocket Buddy Plus stores plugin secrets through Electron safeStorage, which requires\n// a real encryption backend. Linux uses the system keyring; macOS and Windows keep\n// Chromium from prompting during startup/profile initialization.\napp.commandLine.appendSwitch("use-mock-keychain");\nif (process.platform === "linux") {\n  app.commandLine.appendSwitch("password-store", "gnome-libsecret");\n} else {\n  app.commandLine.appendSwitch("password-store", "basic");\n}\n""",
          )
          PY

          rm .github/workflows/resolve-pr12-conflicts.yml
          git diff --check
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- README.md apps/desktop/scripts/run-tests.mjs apps/desktop/src/check-packaging-contract.ts apps/desktop/src/main.ts; then
            echo "Conflict markers remain" >&2
            exit 1
          fi

      - name: Commit resolution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: pre-resolve upstream sync conflicts"
          git push origin HEAD:automation/resolve-pr12-conflicts
