name: Build resolved PR 12 merge commit

on:
  push:
    branches:
      - automation/merge-pr12
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/merge-pr12

      - name: Merge upstream PR head with explicit conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pull/12/head:pr12-head

          if ! git merge --no-ff pr12-head -m "merge: integrate upstream PR 12"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts detected:\n%s\n' "${conflicts[*]}"

            allowed=(
              "README.md"
              "apps/desktop/scripts/run-tests.mjs"
              "apps/desktop/src/check-packaging-contract.ts"
              "apps/desktop/src/main.ts"
            )

            for path in "${conflicts[@]}"; do
              ok=false
              for expected in "${allowed[@]}"; do
                if [[ "$path" == "$expected" ]]; then ok=true; break; fi
              done
              if [[ "$ok" != true ]]; then
                echo "Unexpected conflict: $path" >&2
                exit 1
              fi
            done

            # Current main already contains the reviewed combined resolution for
            # these files. Keep it verbatim while the merge commit records the
            # complete upstream history as its second parent.
            for path in "${conflicts[@]}"; do
              git checkout --ours -- "$path"
              git add "$path"
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain" >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            git commit --no-edit
          fi

          rm .github/workflows/merge-pr12.yml
          git add -A
          git commit --amend --no-edit

          git diff --check HEAD^1 HEAD
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' HEAD -- . ':!pnpm-lock.yaml'; then
            echo "Conflict markers remain in merged tree" >&2
            exit 1
          fi

          parents=$(git show -s --format=%P HEAD)
          parent_count=$(wc -w <<<"$parents")
          if [[ "$parent_count" -ne 2 ]]; then
            echo "Expected a two-parent merge commit, got: $parents" >&2
            exit 1
          fi
          if [[ " $parents " != *" caf4c1bba6f0a8a298d19cc951f43325d098c314 "* ]]; then
            echo "Upstream PR head is not a merge parent: $parents" >&2
            exit 1
          fi

          git push origin HEAD:automation/merge-pr12
