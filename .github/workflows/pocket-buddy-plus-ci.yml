name: Pocket Buddy+ CI

on:
  pull_request:
    branches:
      - main
      - feat/pocket-buddy-plus-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-buddy-plus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run full test suite
        run: pnpm test

      - name: Build unpacked Pocket Buddy+
        run: pnpm package:desktop:plus:dir

      - name: Verify shipping identity
        shell: bash
        run: |
          test -d apps/desktop/dist-electron-plus
          grep -q '^productName: Pocket Buddy+$' apps/desktop/electron-builder.pocket-buddy-plus.yml
          grep -q 'electron-builder.pocket-buddy-plus.yml' apps/desktop/package.json
