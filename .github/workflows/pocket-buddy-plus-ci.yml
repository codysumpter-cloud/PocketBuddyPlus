name: Pocket Buddy+ CI

on:
  pull_request:
    branches:
      - main
      - feat/pocket-buddy-plus-foundation
      - feat/pocket-buddy-plus-product-ui
  # Also verify main itself. Pull-request runs only prove each branch is green
  # against the base it forked from, so two PRs can pass separately and still
  # break main together - and a PR that lands with no checks reported is never
  # verified at all. Both happened here.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocket-buddy-plus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply protected Buddy menu wiring
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/restore-buddy-menu-parity' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/pet-window.ts')
          source = path.read_text()
          import_anchor = 'import { isFocusActionAvailable } from "./capabilities.js";\n'
          buddy_import = 'import { getBuddyMenuItems, type BuddyMenuAction } from "./buddy/buddy-menu.js";\n'
          if buddy_import not in source:
              if import_anchor not in source:
                  raise SystemExit('buddy menu import anchor not found')
              source = source.replace(import_anchor, import_anchor + buddy_import, 1)

          start_marker = 'async function buildPetContextMenuTemplate(action:'
          end_marker = '\nasync function openPluginCommandForm('
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('pet context menu function anchors not found')

          replacement = r'''async function buildPetContextMenuTemplate(action: { readonly label: string; readonly click: () => void; readonly defaultPet?: boolean; readonly focusSessionWindow?: () => void }): Promise<Electron.MenuItemConstructorOptions[]> {
  if (!action.defaultPet) {
    const template: Electron.MenuItemConstructorOptions[] = [];
    if (action.focusSessionWindow) {
      const a11yReady = isFocusActionAvailable();
      const focusLabel = a11yReady
        ? t("pet.menu.focusSessionWindow")
        : t("pet.menu.focusSessionWindowNoA11y");
      template.push({ label: focusLabel, click: action.focusSessionWindow }, { type: "separator" });
    }
    template.push({ label: action.label, click: action.click });
    return template;
  }

  const openControlCenter = (route: "dashboard" | "pets" | "plugins" | "settings"): void => {
    import("./windows.js").then(({ openControlCenterWindow }) => openControlCenterWindow(route)).catch((error) => logError("pet.window", "open control center failed", error));
  };
  const runBuddyBrainCommand = (commandId: string): void => {
    executeDefaultPetPluginCommand("openpets.virtual-pet", commandId).catch((error) => logError("pet.window", `Buddy Brain command failed: ${commandId}`, error));
  };
  const runBuddyMenuAction = (menuAction: BuddyMenuAction): void => {
    switch (menuAction) {
      case "pet":
        runBuddyBrainCommand("pet");
        return;
      case "buddies":
        openControlCenter("pets");
        return;
      case "status":
        runBuddyBrainCommand("status");
        return;
      case "settings":
        openControlCenter("settings");
        return;
      case "quit":
        app.quit();
        return;
      case "talk":
      case "name":
      case "collection":
      case "notes-and-tasks":
      case "guide":
      case "field-guide":
      case "wardrobe":
        runBuddyBrainCommand("open-brain");
        return;
    }
  };

  const commands = await getDefaultPetPluginCommands();
  const topLevel: Electron.MenuItemConstructorOptions[] = [];
  const plugins = new Map<string, { name: string; commands: Electron.MenuItemConstructorOptions[] }>();
  const sorted = [...commands].sort((a, b) => (b.priority ?? 0) - (a.priority ?? 0));
  for (const command of sorted) {
    const item: Electron.MenuItemConstructorOptions = { label: command.commandTitle, click: () => { if (command.form) openPluginCommandForm(command).catch((error) => logError("pet.window", "plugin command form failed", error)); else executeDefaultPetPluginCommand(command.pluginId, command.commandId).catch((error) => logError("pet.window", "plugin command failed", error)); } };
    if (command.placement === "top" || command.featured) { topLevel.push(item); continue; }
    const group = plugins.get(command.pluginId) ?? { name: command.pluginName, commands: [] };
    group.commands.push(item);
    plugins.set(command.pluginId, group);
  }
  const menuItems = await getDefaultPetPluginMenuItems();
  for (const item of menuItems) {
    const group = plugins.get(item.pluginId) ?? { name: item.pluginName, commands: [] };
    group.commands.push({ label: item.title, enabled: item.enabled !== false, type: item.checked === true ? "checkbox" : "normal", checked: item.checked === true ? true : undefined, click: () => { executeDefaultPetPluginMenuSelect(item.pluginId, item.itemId).catch((error) => logError("pet.window", "plugin menu select failed", error)); } });
    plugins.set(item.pluginId, group);
  }

  const template: Electron.MenuItemConstructorOptions[] = getBuddyMenuItems({ supportsProcessExit: true }).map((item) => ({
    label: item.label,
    click: () => runBuddyMenuAction(item.action),
  }));
  template.push({ type: "separator" });
  if (topLevel.length > 0) template.push(...topLevel.slice(0, 8), { type: "separator" });
  if (plugins.size > 0) template.push(...[...plugins.values()].map((plugin) => ({ label: plugin.name, submenu: plugin.commands })), { type: "separator" });
  template.push(
    { label: t("tray.plugins"), click: () => openControlCenter("plugins") },
    { label: t("pet.menu.openControlCenter"), click: () => openControlCenter("dashboard") },
    { label: action.label, click: action.click },
  );
  return template;
}
'''
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY
          git diff --check
          if ! git diff --quiet -- apps/desktop/src/pet-window.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/src/pet-window.ts
            git commit -m "[buddy-menu-patch] fix(buddy): restore attached menu parity"
            git push origin HEAD:fix/restore-buddy-menu-parity
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Several inherited workspace packages resolve sibling declarations from
      # dist/. A completely clean checkout therefore must build the dependency
      # graph before the recursive no-emit typecheck can be meaningful.
      - name: Build workspace dependency graph
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run full test suite
        run: pnpm test

      - name: Build unpacked Pocket Buddy+
        run: pnpm package:desktop:plus:dir

      - name: Verify shipping identity
        shell: bash
        run: |
          test -d apps/desktop/dist-electron-plus
          grep -Fqx 'productName: Pocket Buddy+' apps/desktop/electron-builder.pocket-buddy-plus.yml
          grep -Fq 'electron-builder.pocket-buddy-plus.yml' apps/desktop/package.json

  macos-app:
    name: Package, smoke-launch, and verify playable Home
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unpacked Pocket Buddy+ app
        run: pnpm package:desktop:plus:dir

      - name: Verify bundle and smoke-launch
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/desktop/dist-electron-plus -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(basename "$APP_PATH")" = 'Pocket Buddy+.app'

          PLIST_PATH="$APP_PATH/Contents/Info.plist"
          test -f "$PLIST_PATH"
          BUNDLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST_PATH")"
          BUNDLE_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST_PATH")"
          echo "App bundle: $APP_PATH"
          echo "CFBundleName: $BUNDLE_NAME"
          echo "CFBundleExecutable: $BUNDLE_EXECUTABLE"
          test "$BUNDLE_NAME" = 'Pocket Buddy+'

          EXECUTABLE_PATH="$APP_PATH/Contents/MacOS/$BUNDLE_EXECUTABLE"
          test -x "$EXECUTABLE_PATH"
          LOG_PATH="$RUNNER_TEMP/pocket-buddy-plus-smoke.log"
          OPENPETS_DISABLE_PLUGIN_CATALOG=1 "$EXECUTABLE_PATH" >"$LOG_PATH" 2>&1 &
          APP_PID=$!
          sleep 12
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat "$LOG_PATH"
            exit 1
          fi
          kill "$APP_PID" || true
          wait "$APP_PID" || true

      - name: Verify playable Home interactions and captures
        run: pnpm --filter @open-pets/desktop capture:home

      - name: Upload playable Home verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Buddy+-Home-verification
          path: apps/desktop/artifacts/home-corners
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pocket Buddy+ macOS package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Buddy+-macOS
          path: apps/desktop/dist-electron-plus
          if-no-files-found: error
          retention-days: 14
