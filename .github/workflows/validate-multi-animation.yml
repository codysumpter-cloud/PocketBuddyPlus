name: Validate multi-animation pet manifests

on:
  push:
    branches:
      - agent/multi-animation-pet-manifests
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-animation-pet-manifests

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.8 --activate
          pnpm --version

      - name: Normalize traversal assertion and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('packages/pixel-asset-pipeline/src/check-pixellab-importer.ts')
          text = path.read_text()
          old = 'await assert.rejects(() => inspectPixelLabExport(unsafe), /Unsafe ZIP path/);'
          new = 'await assert.rejects(() => inspectPixelLabExport(unsafe), /Unsafe ZIP path|invalid relative path/);'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Traversal assertion is not in an expected state')
          PY

          pnpm install --no-frozen-lockfile
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/pixel-asset-pipeline/src/check-pixellab-importer.ts pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'test(pets): accept parser-level traversal rejection'
            git push origin HEAD:agent/multi-animation-pet-manifests
          fi

      - name: Focused schema and importer tests
        run: |
          pnpm --filter @open-pets/pet-format build
          pnpm --filter @open-pets/pet-format test
          pnpm --filter @open-pets/pixel-asset-pipeline build
          pnpm --filter @open-pets/pixel-asset-pipeline test
          pnpm --filter install-pet build
          pnpm --filter install-pet test
          pnpm --filter @open-pets/desktop test:build
          node apps/desktop/scripts/run-tests.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Full test suite
        run: pnpm test

      - name: UI verification
        run: xvfb-run -a pnpm verify:ui

      - name: Package unpacked Pocket Buddy+
        run: pnpm package:desktop:plus:dir

      - name: Build portable PixelLab importer
        run: |
          rm -rf /tmp/pixel-importer-runtime
          pnpm --filter @open-pets/pixel-asset-pipeline deploy --prod /tmp/pixel-importer-runtime
          tar -C /tmp -czf /tmp/pixel-importer-runtime.tgz pixel-importer-runtime

      - name: Record validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version 2>/dev/null || echo unavailable)"
            echo "lock_sha256=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
            find apps/desktop/dist-electron-plus -maxdepth 2 -type f -printf '%P %s bytes\n' 2>/dev/null | sort | head -200 || true
          } > /tmp/multi-animation-validation-summary.txt

      - name: Upload lockfile and importer runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-animation-build-support
          path: |
            pnpm-lock.yaml
            /tmp/pixel-importer-runtime.tgz
            /tmp/multi-animation-validation-summary.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload unpacked Pocket Buddy+
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Buddy+-multi-animation-linux
          path: apps/desktop/dist-electron-plus
          if-no-files-found: warn
          retention-days: 3
