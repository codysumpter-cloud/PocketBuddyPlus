name: Repair multi-animation CI inputs

on:
  push:
    branches:
      - agent/multi-animation-pet-manifests

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-animation-pet-manifests

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize traversal rejection assertion and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('packages/pixel-asset-pipeline/src/check-pixellab-importer.ts')
          text = path.read_text()
          old = 'await assert.rejects(() => inspectPixelLabExport(unsafe), /Unsafe ZIP path/);'
          new = 'await assert.rejects(() => inspectPixelLabExport(unsafe), /Unsafe ZIP path|invalid relative path/);'
          if old not in text:
              raise SystemExit('Expected traversal assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY

          corepack enable
          corepack prepare pnpm@11.0.8 --activate
          pnpm install --no-frozen-lockfile
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/pixel-asset-pipeline/src/check-pixellab-importer.ts pnpm-lock.yaml
          git commit -m 'test(pets): accept parser-level traversal rejection'
          git push origin HEAD:agent/multi-animation-pet-manifests
