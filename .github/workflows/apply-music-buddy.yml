name: Apply verified Music Buddy provider

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/music-buddy-spotify-provider' && !contains(github.event.pull_request.title, '[music-buddy-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Keep Spotify redirect configuration host-owned
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          oauth = "apps/desktop/src/plugin-oauth.ts"
          replace_once(
              oauth,
              'google: { authorizationUrl: "https://accounts.google.com/o/oauth2/v2/auth", tokenUrl: "https://oauth2.googleapis.com/token", authorizationParams: { access_type: "offline", prompt: "consent" }, allowedScopes:',
              'google: { authorizationUrl: "https://accounts.google.com/o/oauth2/v2/auth", tokenUrl: "https://oauth2.googleapis.com/token", authorizationParams: { access_type: "offline", prompt: "consent" }, loopbackPort: undefined, allowedScopes:',
          )
          replace_once(
              oauth,
              'spotify: { authorizationUrl: "https://accounts.spotify.com/authorize", tokenUrl: "https://accounts.spotify.com/api/token", authorizationParams: {}, allowedScopes:',
              'spotify: { authorizationUrl: "https://accounts.spotify.com/authorize", tokenUrl: "https://accounts.spotify.com/api/token", authorizationParams: {}, loopbackPort: 48373, allowedScopes:',
          )
          replace_once(
              oauth,
              '''      const stateToken = base64Url(randomBytes(24));
      const { server, port, codePromise } = await startLoopbackListener(stateToken);
      try {
        const redirectUri = `http://127.0.0.1:${port}/callback`;
        const provider = oauthProviders[config.provider];''',
              '''      const stateToken = base64Url(randomBytes(24));
      const provider = oauthProviders[config.provider];
      const { server, port, codePromise } = await startLoopbackListener(stateToken, provider.loopbackPort);
      try {
        const redirectUri = `http://127.0.0.1:${port}/callback`;''',
          )
          replace_once(
              oauth,
              'async function startLoopbackListener(stateToken: string): Promise<{ server: Server; port: number; codePromise: Promise<string> }> {',
              'async function startLoopbackListener(stateToken: string, loopbackPort?: number): Promise<{ server: Server; port: number; codePromise: Promise<string> }> {',
          )
          replace_once(
              oauth,
              '''  await new Promise<void>((resolve, reject) => {
    server.once("error", reject);
    server.listen(0, "127.0.0.1", () => resolve());
  });''',
              '''  try {
    await new Promise<void>((resolve, reject) => {
      server.once("error", reject);
      server.listen(loopbackPort ?? 0, "127.0.0.1", () => resolve());
    });
  } catch (error) {
    clearTimeout(timeout);
    if (loopbackPort !== undefined) throw new Error(`OAuth loopback port ${loopbackPort} is unavailable. Close the other listener and retry.`);
    throw error;
  }''',
          )

          codemap = "plugins/official/codemap.md"
          replace_once(
              codemap,
              '| `openpets.prismcade-creator` | Builds Prismcade game manifests and outfit-aware character recipes in a sandboxed creator panel. | `commands`, `ui.panel`, `files` |',
              '| `openpets.prismcade-creator` | Builds Prismcade game manifests and outfit-aware character recipes in a sandboxed creator panel. | `commands`, `ui.panel`, `files` |\n| `openpets.music-buddy` | Provider-based music companion with Spotify now-playing status, announcements, and playback controls. | `auth`, `network`, `network:write`, `status`, `commands`, `pet` |',
          )
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Music Buddy and host contracts
        run: |
          node plugins/official/openpets.music-buddy/test.js
          pnpm plugins:test
          pnpm --filter @open-pets/desktop typecheck
          pnpm plugins:check

      - name: Commit verified implementation and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-music-buddy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(music-buddy): add secure Spotify provider [music-buddy-applied]"
          git push origin HEAD:feat/music-buddy-spotify-provider
