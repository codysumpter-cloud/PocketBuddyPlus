name: Windows monitor containment

on:
  pull_request:
    paths:
      - "apps/desktop/src/display.ts"
      - "apps/desktop/src/monitor-manager.ts"
      - "apps/desktop/src/confinement-manager.ts"
      - "apps/desktop/src/main.ts"
      - "apps/desktop/src/renderer/index.html"
      - "apps/desktop/src/renderer/src/monitor-settings-ui.ts"
      - "apps/desktop/control-center-preload.cjs"
      - "apps/desktop/tests/**"
      - "apps/desktop/electron-builder.plus.yml"
      - "apps/desktop/electron-builder.pocket-buddy-plus.yml"
      - ".github/workflows/windows-monitor-containment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    name: Windows package and monitor contract
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop
        run: pnpm --filter @open-pets/desktop typecheck

      - name: Build desktop test output
        run: pnpm --filter @open-pets/desktop test:build

      - name: Run Windows monitor containment regressions
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $tests = @(
            ".test-dist/tests/display.test.js",
            ".test-dist/tests/monitor-confinement.test.js",
            ".test-dist/tests/pet-motion-engine-clamp.test.js",
            ".test-dist/tests/monitor-settings-contract.test.js"
          )
          foreach ($test in $tests) {
            Write-Host "Running $test"
            node $test
            if ($LASTEXITCODE -ne 0) {
              throw "Monitor regression failed: $test"
            }
          }

      - name: Build Windows Pocket Buddy+ installer and unpacked app
        run: pnpm package:desktop:plus

      - name: Verify Windows packaging outputs
        shell: pwsh
        run: |
          $root = "apps/desktop/dist-electron-plus"
          $installer = Get-ChildItem -Path $root -Recurse -File -Filter "Pocket-Buddy+-*-win-*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Pocket Buddy+ NSIS installer was not produced."
          }

          $unpackedDirs = Get-ChildItem -Path $root -Directory | Where-Object { $_.Name -match "win.*unpacked" }
          if (-not $unpackedDirs) {
            throw "Pocket Buddy+ win-unpacked directory was not produced alongside the installer."
          }

          $unpackedExe = $unpackedDirs | ForEach-Object {
            Get-ChildItem -Path $_.FullName -File -Filter "*.exe" | Where-Object { $_.Name -notmatch "^(chrome_crashpad_handler|elevate)\.exe$" }
          } | Select-Object -First 1
          if (-not $unpackedExe) {
            throw "Pocket Buddy+ executable was not found in win-unpacked."
          }

          $asar = $unpackedDirs | ForEach-Object {
            Get-ChildItem -Path $_.FullName -Recurse -File -Filter "app.asar"
          } | Select-Object -First 1
          if (-not $asar) {
            throw "Packaged win-unpacked app.asar was not produced."
          }

          if (-not (Test-Path "apps/desktop/dist/monitor-manager.js")) {
            throw "Compiled monitor-manager.js is missing before packaging."
          }
          if (-not (Test-Path "apps/desktop/dist/display.js")) {
            throw "Compiled display.js is missing before packaging."
          }

          $compiledMain = Get-Content "apps/desktop/dist/main.js" -Raw
          if ($compiledMain -notmatch "monitor-manager\.js") {
            throw "Compiled main.js does not load the monitor-aware runtime."
          }

          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Unpacked executable: $($unpackedExe.FullName)"
          Write-Host "Packaged app.asar: $($asar.FullName)"
          Write-Host "Monitor-aware runtime is compiled into the Windows desktop entrypoint."
