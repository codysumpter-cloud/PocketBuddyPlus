<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Pocket Buddy+ TinyHouse Local Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-label="TinyHouse playable room builder">
    <div id="game-shell">
      <div id="world-viewport" tabindex="0" aria-label="Interactive isometric room">
        <div id="world-stage">
          <div id="floor-layer" class="world-layer"></div>
          <div id="wall-layer" class="world-layer"></div>
          <div id="item-layer" class="world-layer"></div>
          <div id="placement-ghost" hidden></div>
        </div>

        <div id="brand" aria-label="TinyHouse local game logo">
          <span class="globe">◈</span><span class="tiny">TINY</span><span class="house">HOUSE!</span>
          <small>POCKET BUDDY+ LOCAL GAME</small>
        </div>

        <div id="window-buttons">
          <button id="clear-room" title="Clear placed items">×</button>
          <button id="reset-room" title="Reset room">↶</button>
        </div>

        <div id="selection-tools" class="pixel-panel" hidden>
          <button data-action="activate" title="Play animation / interact (Enter)">▶</button>
          <button data-action="flip" title="Flip / rotate (R)">↔</button>
          <button data-action="layer-down" title="Move behind">↓</button>
          <button data-action="layer-up" title="Move in front">↑</button>
          <button data-action="duplicate" title="Duplicate">⧉</button>
          <button data-action="delete" title="Delete">⌫</button>
        </div>

        <div id="camera-tools">
          <div class="camera-buttons">
            <button id="zoom-in" title="Zoom in">⌕+</button>
            <button id="zoom-out" title="Zoom out">⌕−</button>
            <button id="center-view" title="Center room">✥</button>
            <button id="export-room" title="Export room image">◉</button>
          </div>
          <div class="space-hint">CLICK ASSET · CLICK FLOOR OR TABLE<br><span>DRAG FREELY · DOUBLE-CLICK TO INTERACT · SPACE TO PAN</span></div>
        </div>

        <div id="toast" role="status" aria-live="polite"></div>
        <pre id="selftest-report" hidden></pre>
      </div>

      <aside id="catalog" class="notebook" aria-label="Asset catalog">
        <div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="catalog-head">
          <input id="search" type="search" placeholder="Search assets" aria-label="Search assets" />
          <div class="catalog-actions">
            <button id="save-room" title="Save room">SAVE</button>
            <button id="load-room" title="Load room">LOAD</button>
          </div>
        </div>
        <div id="asset-grid" class="asset-grid" aria-live="polite"></div>
        <div class="pager">
          <button id="prev-page" aria-label="Previous page">◀</button>
          <span id="page-label">1 / 1</span>
          <button id="next-page" aria-label="Next page">▶</button>
        </div>
        <nav id="tabs" class="vertical-tabs" aria-label="Asset categories"></nav>
      </aside>
    </div>
  </main>
  <script src="manifest.js"></script>
  <script src="generated-recipes.js"></script>
  <script src="local-assets.js"></script>
  <script src="app.js"></script>
</body>
</html>
